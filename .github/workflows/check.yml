name: check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/skill-examples/target
          key: skill-examples-${{ runner.os }}-${{ hashFiles('scripts/check-examples.mjs') }}
      - name: Tests, skill index, version sync
        run: npm run check
      - name: Check internal Markdown links resolve
        run: |
          fail=0
          while IFS= read -r line; do
            file="${line%%:*}"
            target="${line#*:}"
            resolved="$(dirname "$file")/$target"
            if [ ! -e "$resolved" ] && [ ! -e "$target" ]; then
              echo "::error file=$file::broken link to $target"
              fail=1
            fi
          done < <(grep -rnoE '\]\((\./|\.\./)[^)#]+\)' --include='*.md' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=superpowers . \
            | sed -E 's/^([^:]+):[0-9]+:\]\((.*)\)$/\1:\2/')
          exit $fail
