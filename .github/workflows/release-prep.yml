name: Release prep

# Assembles CHANGELOG.md from accumulated changesets on `dev`, BEFORE the release.
# Merge the resulting PR into `dev`, then open the dev -> main PR and comment
# `/fast-forward`. The dev -> main merge cannot build the changelog itself: it is
# fast-forward only, so main must equal dev's exact HEAD.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prep:
    runs-on: ubuntu-latest
    environment: ff_merge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.FF_MERGE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: Validate input and fragments
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a valid semver version (expected e.g. 0.2.0)."
            exit 1
          fi
          if ! ls .changeset/*.md 2>/dev/null | grep -qv 'README.md'; then
            echo "::error::No changesets in .changeset/ — nothing to release."
            exit 1
          fi

      - name: Assemble changelog and sync versions
        run: |
          npx changeset version
          node scripts/sync-plugin-version.mjs

      - name: Verify the assembled version matches the requested one
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::changeset version produced $ACTUAL but $VERSION was requested. Adjust the changeset bump types."
            exit 1
          fi

      - run: npm run check

      - name: Open release-prep PR
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.FF_MERGE_TOKEN }}
        run: |
          BRANCH="release-prep/v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "docs(changelog): assemble notes for v${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "docs(changelog): release v${VERSION}" \
            --label skip-changelog \
            --body "Auto-generated by release-prep. Assembles CHANGELOG.md from changesets and syncs plugin.json. Merge into \`dev\`, then open the dev -> main PR."
